
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Табель-график СЦИО</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12172b;
    --paper:#f5f7fb;
    --panel:#ffffff;
    --line:#e2e6f0;
    --muted:#6b7280;
    --day:#f59e0b;
    --day-soft:#fef3c7;
    --night:#4c5fd5;
    --night-soft:#e3e6fb;
    --work:#16a34a;
    --work-soft:#dcfce7;
    --sub:#b45309;
    --sub-soft:#fef1d6;
    --rest:#94a3b8;
    --rest-soft:#eef1f5;
    --sick:#dc2626;
    --sick-soft:#fde3e2;
    --vacation:#7c3aed;
    --vacation-soft:#ede4fd;
    --accent:#2454ff;
    --accent-soft:#e7edff;
    --radius:14px;
    --shadow: 0 1px 2px rgba(18,23,43,.04), 0 8px 24px -12px rgba(18,23,43,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; overflow-x:hidden;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  header.top{
    padding:16px clamp(12px,3vw,20px) 0;
  }
  .brand{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand h1{
    font-family:"Space Grotesk", sans-serif; font-weight:700; font-size:20px; margin:0 0 2px; letter-spacing:-.01em;
  }
  .brand .sub{ color:var(--muted); font-size:11px; max-width:100%; line-height:1.4; }
  .brand .sub strong{ color:var(--accent); }
  .cyclebar{
    margin-top:12px; height:6px; border-radius:99px; overflow:hidden; display:flex;
    box-shadow: inset 0 0 0 1px rgba(18,23,43,.05);
  }
  .cyclebar span{ flex:1; }

  .toolbar{ display:flex; gap:6px; flex-wrap:wrap; width:100%; }
  .btn{
    border:none; border-radius:8px; padding:7px 10px; font-size:11px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px; font-family:inherit; transition:transform .05s ease, filter .1s ease;
    flex:1; justify-content:center; min-width:44px;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:var(--panel); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  .btn-ghost:hover{ background:#fafbff; }
  .btn-danger{ background:var(--sick-soft); color:var(--sick); }
  .btn-success{ background:var(--work-soft); color:var(--work); }

  nav.tabs{
    display:flex; gap:2px; margin:12px clamp(12px,3vw,20px) 0; border-bottom:1px solid var(--line);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  nav.tabs button{
    background:none; border:none; cursor:pointer; font-family:"Space Grotesk",sans-serif;
    font-weight:600; font-size:11px; color:var(--muted); padding:8px 10px 10px; position:relative;
    white-space:nowrap; display:flex; align-items:center; gap:5px; flex-shrink:0;
  }
  nav.tabs button .dot{ width:5px; height:5px; border-radius:50%; background:var(--line); }
  nav.tabs button.active{ color:var(--ink); }
  nav.tabs button.active .dot{ background:var(--accent); }
  nav.tabs button.active::after{
    content:""; position:absolute; left:6px; right:6px; bottom:-1px; height:2px; background:var(--accent); border-radius:2px;
  }
  nav.tabs button:hover{ color:var(--ink); }

  main{ padding:12px clamp(10px,2.5vw,20px) 40px; max-width:1400px; margin:0 auto; }
  .panel{ display:none; }
  .panel.active{ display:block; animation:fadeIn .18s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;} }

  .card{
    background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px 14px; margin-bottom:12px;
  }
  .card h2{
    font-family:"Space Grotesk",sans-serif; font-size:15px; margin:0 0 3px; display:flex; align-items:center; gap:6px;
  }
  .card .hint{ color:var(--muted); font-size:11px; margin:0 0 12px; line-height:1.4; }
  .card .warning{
    background:var(--sick-soft); color:var(--sick); padding:8px 12px; border-radius:8px; font-size:12px; margin-top:10px;
  }

  .field{ display:flex; flex-direction:column; gap:3px; }
  .field label{ font-size:10px; color:var(--muted); font-weight:600; }
  .field input, .field select{
    border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12px;
    background:#fff; color:var(--ink); font-family:inherit; -webkit-appearance:none; appearance:none;
  }
  .field input:focus, .field select:focus{ border-color:var(--accent); }
  .settings-grid{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }

  .month-nav{ display:flex; align-items:center; gap:6px; flex:1; min-width:200px; }
  .month-nav button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer;
    font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .month-nav button:active{ transform:scale(0.92); }
  .month-nav .field{ flex:1; min-width:80px; }
  .current-month-label{
    font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:15px; color:var(--ink);
    padding:0 4px; min-width:80px; text-align:center; flex-shrink:0;
  }

  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .stat{
    background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); padding:10px 12px;
    border-left:3px solid var(--accent);
  }
  .stat .num{ font-family:"JetBrains Mono",monospace; font-size:18px; font-weight:600; line-height:1; }
  .stat .lbl{ font-size:10px; color:var(--muted); margin-top:4px; }
  .stat.work{ border-left-color:var(--work); }
  .stat.sick{ border-left-color:var(--sick); }
  .stat.vac{ border-left-color:var(--vacation); }

  .rows{ display:flex; flex-direction:column; gap:6px; }
  .rowline{
    display:grid; grid-template-columns:1fr; gap:6px; align-items:center;
    padding:8px; border:1px solid var(--line); border-radius:10px; background:#fbfcfe;
  }
  .rowline.swaprow{ grid-template-columns:1fr; }
  .rowline input, .rowline select{ 
    width:100%; border:1px solid var(--line); border-radius:7px; padding:6px 8px; font-size:12px; 
    font-family:inherit; background:#fff;
  }
  .shift-pill-wrap{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .cycle-preview{ display:flex; gap:2px; }
  .cycle-preview i{ width:7px; height:12px; border-radius:2px; background:var(--rest-soft); display:inline-block; }
  .cycle-preview i.on{ background:var(--work); }
  .icon-btn{
    width:30px; height:30px; border-radius:7px; border:none; background:transparent; color:#b91c1c; cursor:pointer;
    font-size:15px; display:flex; align-items:center; justify-content:center; align-self:center;
  }
  .icon-btn:active{ transform:scale(0.92); }
  .icon-btn.ok{ color:var(--work); }
  .icon-btn.ok:hover{ background:var(--work-soft); }
  .add-link{
    margin-top:10px; background:none; border:1.5px dashed var(--line); border-radius:10px; padding:10px;
    width:100%; color:var(--accent); font-weight:600; font-size:12px; cursor:pointer;
  }
  .add-link:active{ transform:scale(0.98); }

  .empty-note{
    color:var(--muted); font-size:12px; padding:16px; text-align:center; border:1.5px dashed var(--line);
    border-radius:10px; background:#fbfcfe;
  }

  .search-wrap{ 
    display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:flex-end;
  }
  .search-wrap .field{ flex:1; min-width:120px; }
  .search-wrap .field:last-child{ flex:0 1 auto; }

  .schedule-scroll{
    overflow:auto; border-radius:10px; box-shadow:var(--shadow); max-height:65vh; background:#fff;
    -webkit-overflow-scrolling:touch;
  }
  table.sched{ 
    border-collapse:separate; border-spacing:0; font-size:10px; width:100%; 
    min-width:400px;
  }
  table.sched th, table.sched td{
    border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:3px 3px; text-align:center; white-space:nowrap;
  }
  table.sched thead th{
    position:sticky; top:0; background:#fbfcfe; font-family:"JetBrains Mono",monospace; font-weight:600; z-index:3;
    color:var(--ink); font-size:9px;
  }
  table.sched thead th.corner{ z-index:5; }
  table.sched thead .wd{ font-family:"Inter",sans-serif; font-weight:500; font-size:8px; color:var(--muted); display:block; }
  table.sched td.name, table.sched th.name{
    position:sticky; left:0; background:#fff; text-align:left; z-index:2; font-weight:600; min-width:90px; 
    max-width:120px; box-shadow:1px 0 0 var(--line); padding:3px 6px 3px 5px; font-size:9px;
  }
  table.sched thead th.name{ z-index:4; background:#fbfcfe; }
  table.sched td.shifttype{ 
    color:var(--muted); font-size:9px; min-width:45px; padding:3px 3px;
  }
  table.sched td.weekend, table.sched th.weekend{ background:#fff9ec; }
  table.sched td.today, table.sched th.today{ box-shadow: inset 0 0 0 1.5px var(--accent); }
  table.sched tbody tr:active td{ background:#f7f9ff; }
  table.sched td.clickable{ cursor:pointer; touch-action:manipulation; }
  table.sched td.clickable:active{ background:#e7edff !important; }
  
  table.sched td .badge{
    min-width:16px; height:16px; font-size:8px; padding:0 3px; border-radius:4px;
  }
  table.sched th, table.sched td{
    padding:2px 2px;
  }
  table.sched td:last-child,
  table.sched th:last-child {
    border-right: none;
  }

  .badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:16px; border-radius:4px;
    font-weight:700; font-family:"JetBrains Mono",monospace; font-size:8px; padding:0 3px;
  }
  .badge.Р{ background:var(--work-soft); color:var(--work); }
  .badge.РЗ{ background:var(--sub-soft); color:var(--sub); }
  .badge.В{ background:var(--rest-soft); color:var(--rest); font-weight:500; }
  .badge.Б{ background:var(--sick-soft); color:var(--sick); }
  .badge.О{ background:var(--vacation-soft); color:var(--vacation); }

  tr.totals td{ background:#f3f5fb; font-weight:700; font-family:"JetBrains Mono",monospace; font-size:10px; }
  tr.totals td.name{ background:#f3f5fb; font-family:"Space Grotesk",sans-serif; font-size:9px; }

  .legend{ display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
  .legend .chip{
    display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:99px; font-size:9px; font-weight:600;
  }
  .legend .chip .sw{ width:7px; height:7px; border-radius:2px; }

  .toast{
    position:fixed; bottom:20px; left:20px; right:20px; background:var(--ink); color:#fff;
    padding:12px 18px; border-radius:10px; font-weight:600; font-size:13px; z-index:999;
    animation:slideUp .3s ease; box-shadow:0 4px 12px rgba(0,0,0,.2); text-align:center;
  }
  @keyframes slideUp{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:none;} }

  .conflict-badge{
    display:inline-block; background:var(--sick); color:#fff; border-radius:99px; padding:2px 8px;
    font-size:10px; font-weight:700; margin-left:6px;
  }

  /* Для телефонов */
  @media (max-width:480px){
    header.top{ padding:12px 10px 0; }
    .brand h1{ font-size:17px; }
    .brand .sub{ font-size:10px; }
    .toolbar .btn{ font-size:10px; padding:6px 6px; }
    nav.tabs button{ font-size:10px; padding:6px 8px 8px; }
    nav.tabs{ margin:10px 10px 0; }
    main{ padding:10px 10px 30px; }
    .card{ padding:10px 10px; margin-bottom:10px; }
    .card h2{ font-size:13px; }
    .card .hint{ font-size:10px; }
    
    .settings-grid{ gap:6px; }
    .settings-grid .field{ min-width:auto; width:100% !important; }
    .month-nav{ flex-wrap:wrap; justify-content:center; }
    .month-nav .field{ min-width:100px !important; flex:0 1 auto; }
    .current-month-label{ font-size:13px; min-width:70px; order:-1; width:100%; text-align:center; margin-bottom:2px; }
    
    .stats{ grid-template-columns:1fr 1fr; gap:5px; }
    .stat{ padding:8px 10px; }
    .stat .num{ font-size:15px; }
    .stat .lbl{ font-size:9px; }
    
    .search-wrap{ flex-direction:column; gap:5px; }
    .search-wrap .field{ min-width:auto; }
    
    .schedule-scroll{ max-height:55vh; border-radius:8px; }
    table.sched{ font-size:8px; min-width:300px; }
    table.sched th, table.sched td{ padding:2px 2px; }
    table.sched td.name, table.sched th.name{ 
      min-width:60px; max-width:80px; padding:2px 4px 2px 3px; font-size:8px;
    }
    table.sched td.shifttype{ min-width:30px; font-size:7px; padding:2px 2px; }
    table.sched td .badge{ min-width:14px; height:14px; font-size:7px; padding:0 2px; border-radius:3px; }
    table.sched thead th{ font-size:7px; }
    table.sched thead .wd{ font-size:6px; }
    table.sched thead th.corner{ font-size:7px; }
    
    .rowline, .rowline.swaprow{ gap:5px; padding:6px; }
    .rowline input, .rowline select{ font-size:11px; padding:5px 6px; }
    .legend .chip{ font-size:8px; padding:2px 6px; }
    .add-link{ font-size:11px; padding:8px; }
    .icon-btn{ width:26px; height:26px; font-size:13px; }
    .toast{ font-size:12px; padding:10px 14px; bottom:10px; left:10px; right:10px; }
  }

  @media (max-width:380px){
    .brand h1{ font-size:15px; }
    .toolbar .btn{ font-size:9px; padding:4px 4px; }
    table.sched{ min-width:250px; }
    table.sched td.name, table.sched th.name{ min-width:50px; max-width:60px; font-size:7px; }
    .current-month-label{ font-size:11px; min-width:60px; }
    .month-nav .field{ min-width:80px !important; }
    .month-nav button{ width:26px; height:26px; font-size:12px; }
  }

  /* Убираем наведение на тач-устройствах */
  @media (hover:none){
    .btn:hover{ filter:none; }
    .btn-ghost:hover{ background:var(--panel); }
    .add-link:hover{ background:none; }
    table.sched tbody tr:hover td{ background:transparent; }
    table.sched tbody tr:hover td.name{ background:transparent; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div>
      <h1>Табель-график СЦИО</h1>
      <p class="sub">Сменный график: смены, замены, больничные и отпуска — считаются автоматически</p>
    </div>
    <div class="toolbar">
      <button class="btn btn-ghost" onclick="exportData()">⬇ JSON</button>
      <button class="btn btn-ghost" onclick="exportCSV()">📊 CSV</button>
      <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">⬆</button>
      <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)">
      <button class="btn btn-ghost" onclick="goToToday()">📅</button>
    </div>
  </div>
  <div class="cyclebar">
    <span style="background:linear-gradient(90deg,#1d2660,#4c5fd5)"></span>
    <span style="background:linear-gradient(90deg,#4c5fd5,#f59e0b)"></span>
    <span style="background:linear-gradient(90deg,#f59e0b,#f59e0b)"></span>
    <span style="background:linear-gradient(90deg,#f59e0b,#4c5fd5)"></span>
    <span style="background:linear-gradient(90deg,#4c5fd5,#1d2660)"></span>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="grafik" onclick="showTab('grafik')"><span class="dot"></span>График</button>
  <button class="tab-btn" data-tab="people" onclick="showTab('people')"><span class="dot"></span>Сотрудники</button>
  <button class="tab-btn" data-tab="swaps" onclick="showTab('swaps')"><span class="dot"></span>Замены</button>
  <button class="tab-btn" data-tab="settings" onclick="showTab('settings')"><span class="dot"></span>Циклы</button>
</nav>

<main>

  <!-- ===== ГРАФИК ===== -->
  <section id="tab-grafik" class="panel active">
    <div class="stats" id="statsRow"></div>

    <div class="card" style="padding-bottom:10px;">
      <div class="settings-grid">
        <div class="month-nav">
          <button onclick="shiftMonth(-1)">‹</button>
          <div class="field" style="min-width:100px;">
            <label>Месяц</label>
            <select id="monthSel" onchange="render()"></select>
          </div>
          <button onclick="shiftMonth(1)">›</button>
          <div class="current-month-label" id="monthLabel">Август 2026</div>
        </div>
        <div class="field" style="width:80px;">
          <label>Год</label>
          <input id="yearInput" type="number" value="2026" onchange="render()">
        </div>
        <div class="field" style="width:80px;">
          <label>Часов</label>
          <input id="shiftHours" type="number" value="12" onchange="render()">
        </div>
        <div class="field" style="width:120px;">
          <label>Дата отсчёта</label>
          <input id="refDate" type="date" value="2026-08-01" onchange="render()">
        </div>
      </div>
    </div>

    <div class="search-wrap">
      <div class="field">
        <label>🔎 Поиск</label>
        <input id="searchInput" placeholder="ФИО..." oninput="renderSchedule()">
      </div>
      <div class="field">
        <label>Фильтр</label>
        <select id="filterShift" onchange="renderSchedule()">
          <option value="">Все</option>
          <option value="День 1">День 1</option>
          <option value="День 2">День 2</option>
          <option value="Ночь 1">Ночь 1</option>
          <option value="Ночь 2">Ночь 2</option>
        </select>
      </div>
      <div style="display:flex; gap:5px; padding-bottom:3px; flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="undo()" title="Ctrl+Z">↩</button>
        <button class="btn btn-ghost" onclick="redo()" title="Ctrl+Y">↪</button>
      </div>
    </div>

    <div class="schedule-scroll">
      <div id="scheduleTable"></div>
    </div>

    <div class="legend">
      <span class="chip" style="background:var(--work-soft); color:var(--work);"><span class="sw" style="background:var(--work);"></span>Р</span>
      <span class="chip" style="background:var(--sub-soft); color:var(--sub);"><span class="sw" style="background:var(--sub);"></span>РЗ</span>
      <span class="chip" style="background:var(--rest-soft); color:var(--rest);"><span class="sw" style="background:var(--rest);"></span>В</span>
      <span class="chip" style="background:var(--sick-soft); color:var(--sick);"><span class="sw" style="background:var(--sick);"></span>Б</span>
      <span class="chip" style="background:var(--vacation-soft); color:var(--vacation);"><span class="sw" style="background:var(--vacation);"></span>О</span>
    </div>
    <div id="conflictsWarning"></div>
  </section>

  <!-- ===== СОТРУДНИКИ ===== -->
  <section id="tab-people" class="panel">
    <div class="card">
      <h2>👥 Сотрудники</h2>
      <p class="hint">ФИО, табельный номер и тип графика.</p>
      <div id="employeesRows" class="rows"></div>
      <button class="add-link" onclick="addEmployee()">+ Добавить</button>
    </div>
  </section>

  <!-- ===== ЗАМЕНЫ ===== -->
  <section id="tab-swaps" class="panel">
    <div class="card">
      <h2>🩺 Замены</h2>
      <p class="hint">Больничные, отпуска и замены.</p>
      <div id="swapsRows" class="rows"></div>
      <button class="add-link" onclick="addSwap()">+ Добавить</button>
    </div>
  </section>

  <!-- ===== НАСТРОЙКИ ЦИКЛОВ ===== -->
  <section id="tab-settings" class="panel">
    <div class="card">
      <h2>⚙️ Циклы</h2>
      <p class="hint">Настройка типов графика.</p>
      <div id="shiftTypesRows" class="rows"></div>
    </div>
  </section>

</main>

<script>
/* ---------- СОСТОЯНИЕ ---------- */

let shiftTypes = {
  "День 1": {cycle:4, work:2, invert:false},
  "День 2": {cycle:4, work:2, invert:true},
  "Ночь 1": {cycle:6, work:3, invert:false},
  "Ночь 2": {cycle:6, work:3, invert:true},
};

let employees = [
  {name:"Дроздов В.С.", id:"856771", shift:"День 1"},
  {name:"Обухов Н.А.", id:"910527", shift:"Ночь 1"},
  {name:"Круголь Д.С.", id:"977195", shift:"Ночь 1"},
  {name:"Ометов Е.П.", id:"1232603", shift:"Ночь 1"},
  {name:"Степанов А.В.", id:"784515", shift:"Ночь 1"},

let swaps = [];

/* ---------- ИСТОРИЯ ДЛЯ UNDO/REDO ---------- */
let history = [];
let historyIndex = -1;
const MAX_HISTORY = 50;

function pushHistory() {
  const state = JSON.stringify({ employees, swaps, shiftTypes });
  history = history.slice(0, historyIndex + 1);
  history.push(state);
  if (history.length > MAX_HISTORY) history.shift();
  historyIndex = history.length - 1;
}

function undo() {
  if (historyIndex > 0) {
    historyIndex--;
    restoreState(history[historyIndex]);
    showToast('↩ Отменено');
  } else {
    showToast('❌ Нечего отменять');
  }
}

function redo() {
  if (historyIndex < history.length - 1) {
    historyIndex++;
    restoreState(history[historyIndex]);
    showToast('↪ Повторено');
  } else {
    showToast('❌ Нечего повторять');
  }
}

function restoreState(json) {
  const data = JSON.parse(json);
  employees = data.employees;
  swaps = data.swaps;
  shiftTypes = data.shiftTypes;
  render();
}

/* ---------- УТИЛИТЫ ---------- */

const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const WEEKDAYS = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];

function pad(n){ return String(n).padStart(2,"0"); }
function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function daysInMonth(year, month){ return new Date(year, month+1, 0).getDate(); }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function parseDate(str){ return new Date(str + 'T00:00:00'); }

function showToast(msg){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const div = document.createElement('div');
  div.className = 'toast';
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2500);
}

function computeDayStatus(day, emp, refDate){
  const key = dateKey(day);
  const asOriginal = swaps.filter(s => s.date === key && s.original === emp.name);
  if (asOriginal.some(s => s.reason === "Больничный")) return "Б";
  if (asOriginal.some(s => s.reason === "Отпуск")) return "О";
  if (asOriginal.length > 0) return "В";

  const asSubstitute = swaps.some(s => s.date === key && s.substitute === emp.name);
  if (asSubstitute) return "РЗ";

  if (!emp.shift || !shiftTypes[emp.shift]) return "";
  const def = shiftTypes[emp.shift];
  const diffDays = Math.round((day - refDate) / 86400000);
  let mod = diffDays % def.cycle;
  if (mod < 0) mod += def.cycle;
  const isWork = def.invert ? (mod >= def.work) : (mod < def.work);
  return isWork ? "Р" : "В";
}

function cyclePreviewHTML(def){
  let html = `<span class="cycle-preview">`;
  for(let i=0;i<def.cycle;i++){
    const on = def.invert ? (i>=def.work) : (i<def.work);
    html += `<i class="${on?'on':''}"></i>`;
  }
  html += `</span>`;
  return html;
}

/* ---------- ВАЛИДАЦИЯ ЗАМЕН ---------- */

function validateSwap(swap, showAlert = true) {
  if (!swap.original) {
    if (showAlert) alert('❌ Выберите сотрудника');
    return false;
  }
  
  const day = parseDate(swap.date);
  const refDate = parseDate(document.getElementById('refDate').value);
  const originalEmp = employees.find(e => e.name === swap.original);
  
  if (!originalEmp) {
    if (showAlert) alert('❌ Сотрудник не найден');
    return false;
  }
  
  const status = computeDayStatus(day, originalEmp, refDate);
  if (status === 'В') {
    if (showAlert) {
      if (swap.reason === 'Замена') {
        alert(`⚠️ ${swap.original} не работает в этот день`);
        return false;
      } else {
        if (!confirm(`⚠️ ${swap.original} выходной (${swap.date}). Продолжить?`)) {
          return false;
        }
      }
    }
  }
  
  const conflicts = swaps.filter(s => 
    s.date === swap.date && 
    s.substitute === swap.substitute && 
    s.original !== swap.original
  );
  
  if (conflicts.length > 0 && swap.substitute) {
    if (showAlert) {
      alert(`⚠️ ${swap.substitute} уже заменяет ${conflicts.map(s => s.original).join(', ')}`);
    }
    return false;
  }
  
  return true;
}

function checkAllConflicts() {
  const conflicts = {};
  swaps.forEach(s => {
    if (s.substitute && s.original) {
      const key = `${s.date}|${s.substitute}`;
      if (!conflicts[key]) conflicts[key] = [];
      conflicts[key].push(s.original);
    }
  });
  
  let warnings = [];
  for (const [key, originals] of Object.entries(conflicts)) {
    if (originals.length > 1) {
      const [date, substitute] = key.split('|');
      warnings.push(`⚠️ ${substitute} заменяет ${originals.join(', ')} ${date}`);
    }
  }
  
  const el = document.getElementById('conflictsWarning');
  if (warnings.length > 0) {
    el.innerHTML = `<div class="card" style="background:var(--sick-soft);border-left:3px solid var(--sick);margin-top:10px;padding:10px;">
      <strong>⚠️ Конфликты:</strong> ${warnings.join('; ')}
    </div>`;
  } else {
    el.innerHTML = '';
  }
  return warnings;
}

/* ---------- РЕНДЕР: СТАТИСТИКА ---------- */

function renderStats(days, refDate){
  let shifts=0, sick=0, vac=0;
  employees.forEach(emp=>{
    days.forEach(d=>{
      const st = computeDayStatus(d, emp, refDate);
      if (st==="Р"||st==="РЗ") shifts++;
      if (st==="Б") sick++;
      if (st==="О") vac++;
    });
  });
  document.getElementById("statsRow").innerHTML = `
    <div class="stat"><div class="num">${employees.length}</div><div class="lbl">Сотрудников</div></div>
    <div class="stat work"><div class="num">${shifts}</div><div class="lbl">Смен</div></div>
    <div class="stat sick"><div class="num">${sick}</div><div class="lbl">Больничных</div></div>
    <div class="stat vac"><div class="num">${vac}</div><div class="lbl">Отпусков</div></div>
  `;
}

/* ---------- РЕНДЕР: ГРАФИК ---------- */

function renderSchedule(){
  const year = parseInt(document.getElementById("yearInput").value);
  const month = parseInt(document.getElementById("monthSel").value);
  const shiftHours = parseFloat(document.getElementById("shiftHours").value) || 0;
  const refDate = parseDate(document.getElementById("refDate").value);
  const nDays = daysInMonth(year, month);
  const today = new Date();
  const search = (document.getElementById("searchInput").value || "").toLowerCase();
  const shiftFilter = document.getElementById("filterShift").value;

  document.getElementById('monthLabel').textContent = `${MONTHS[month]} ${year}`;

  const days = [];
  for(let d=1; d<=nDays; d++){ days.push(new Date(year, month, d)); }

  renderStats(days, refDate);

  const visibleEmployees = employees.filter(e => 
    e.name.toLowerCase().includes(search) &&
    (shiftFilter === '' || e.shift === shiftFilter)
  );

  if (employees.length===0){
    document.getElementById("scheduleTable").innerHTML = `<div class="empty-note">Добавьте сотрудников</div>`;
    return;
  }
  if (visibleEmployees.length===0){
    document.getElementById("scheduleTable").innerHTML = `<div class="empty-note">Ничего не найдено</div>`;
    return;
  }

  let html = `<table class="sched"><thead><tr><th class="name corner">Сотр.</th><th>Граф.</th>`;
  days.forEach(d=>{
    const isWeekend = d.getDay()===0 || d.getDay()===6;
    const isToday = isSameDay(d, today);
    html += `<th class="${isWeekend?'weekend':''} ${isToday?'today':''}">${d.getDate()}<span class="wd">${WEEKDAYS[d.getDay()]}</span></th>`;
  });
  html += `<th>Смен</th><th>Час</th></tr></thead><tbody>`;

  const dayTotals = new Array(nDays).fill(0);

  visibleEmployees.forEach(emp=>{
    html += `<tr><td class="name">${emp.name}</td><td class="shifttype">${emp.shift||"—"}</td>`;
    let shiftsCount = 0;
    days.forEach((d,idx)=>{
      const status = computeDayStatus(d, emp, refDate);
      if (status==="Р" || status==="РЗ"){
        shiftsCount++;
      }
      const isWeekend = d.getDay()===0 || d.getDay()===6;
      const isToday = isSameDay(d, today);
      const title = {"Р":"Рабочий","РЗ":"Замена","В":"Выходной","Б":"Больничный","О":"Отпуск","":""}[status];
      const dateStr = dateKey(d);
      html += `<td class="${isWeekend?'weekend':''} ${isToday?'today':''} clickable" 
        title="${title}" 
        onclick="quickEdit('${emp.name}','${dateStr}','${status}')">${status?`<span class="badge ${status}">${status}</span>`:""}</td>`;
    });
    html += `<td><b>${shiftsCount}</b></td><td><b>${shiftsCount*shiftHours}</b></td>`;
    html += `</tr>`;
  });

  employees.forEach(emp=>{
    days.forEach((d,idx)=>{
      const status = computeDayStatus(d, emp, refDate);
      if (status==="Р" || status==="РЗ") dayTotals[idx]++;
    });
  });

  html += `<tr class="totals"><td class="name">Итого</td><td></td>`;
  dayTotals.forEach(t=>{ html += `<td>${t}</td>`; });
  html += `<td></td><td></td></tr>`;
  html += `</tbody></table>`;

  document.getElementById("scheduleTable").innerHTML = html;
  checkAllConflicts();
}

/* ---------- БЫСТРОЕ РЕДАКТИРОВАНИЕ ---------- */

function quickEdit(name, date, currentStatus) {
  if (currentStatus === '') {
    showToast(`❌ ${name} не работает`);
    return;
  }
  
  const existingIndex = swaps.findIndex(s => s.date === date && s.original === name);
  const existing = existingIndex >= 0 ? swaps[existingIndex] : null;
  
  const action = confirm(
    `${name}\n${date}\nСтатус: ${currentStatus}\n\n` +
    (existing ? `Изменить (${existing.reason})?` : 'Добавить больничный/отпуск?') +
    `\n\nOK — больничный, Отмена — отпуск`
  );
  
  const reason = action ? "Больничный" : "Отпуск";
  
  if (existing) {
    existing.reason = reason;
  } else {
    const newSwap = { date, original: name, substitute: "", reason };
    if (!validateSwap(newSwap, true)) return;
    swaps.push(newSwap);
  }
  
  render();
  showToast(`✅ ${name} — ${reason}`);
}

/* ---------- НАВИГАЦИЯ ПО МЕСЯЦАМ ---------- */

function shiftMonth(delta){
  const sel = document.getElementById("monthSel");
  const yearInput = document.getElementById("yearInput");
  let m = parseInt(sel.value) + delta;
  let y = parseInt(yearInput.value);
  if (m<0){ m=11; y--; }
  if (m>11){ m=0; y++; }
  sel.value = m;
  yearInput.value = y;
  render();
}

function goToToday(){
  const today = new Date();
  document.getElementById('monthSel').value = today.getMonth();
  document.getElementById('yearInput').value = today.getFullYear();
  render();
  showToast('📅 Сегодня');
}

/* ---------- ЭКСПОРТ / ИМПОРТ ---------- */

function exportData(){
  const data = {
    employees, swaps, shiftTypes,
    settings:{
      month: document.getElementById("monthSel").value,
      year: document.getElementById("yearInput").value,
      shiftHours: document.getElementById("shiftHours").value,
      refDate: document.getElementById("refDate").value
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "grafik-scio.json";
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Экспортировано');
}

function importData(event){
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if (data.employees) employees = data.employees;
      if (data.swaps) swaps = data.swaps;
      if (data.shiftTypes) shiftTypes = data.shiftTypes;
      if (data.settings){
        document.getElementById("monthSel").value = data.settings.month;
        document.getElementById("yearInput").value = data.settings.year;
        document.getElementById("shiftHours").value = data.settings.shiftHours;
        document.getElementById("refDate").value = data.settings.refDate;
      }
      pushHistory();
      render();
      showToast('✅ Импортировано');
    }catch(err){
      alert("❌ Ошибка: " + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ---------- ЭКСПОРТ В CSV ---------- */

function exportCSV(){
  const year = parseInt(document.getElementById("yearInput").value);
  const month = parseInt(document.getElementById("monthSel").value);
  const shiftHours = parseFloat(document.getElementById("shiftHours").value) || 0;
  const refDate = parseDate(document.getElementById("refDate").value);
  const nDays = daysInMonth(year, month);
  const days = [];
  for(let d=1; d<=nDays; d++){ days.push(new Date(year, month, d)); }
  
  let csv = '\uFEFF';
  csv += 'Сотрудник,Табельный,График,' + days.map(d => `${d.getDate()}`).join(',') + ',Смен,Часов\n';
  
  employees.forEach(emp => {
    const row = [emp.name, emp.id || '', emp.shift || ''];
    let shifts = 0;
    days.forEach(d => {
      const status = computeDayStatus(d, emp, refDate);
      row.push(status || '');
      if (status === 'Р' || status === 'РЗ') shifts++;
    });
    row.push(shifts);
    row.push(shifts * shiftHours);
    csv += row.join(',') + '\n';
  });
  
  const totalRow = ['Итого', '', ''];
  for(let i=0; i<nDays; i++){
    let total = 0;
    employees.forEach(emp => {
      const status = computeDayStatus(days[i], emp, refDate);
      if (status === 'Р' || status === 'РЗ') total++;
    });
    totalRow.push(total);
  }
  totalRow.push('');
  totalRow.push('');
  csv += totalRow.join(',') + '\n';
  
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `график_${MONTHS[month]}_${year}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📊 CSV готов');
}

/* ---------- СОХРАНЕНИЕ В LOCALSTORAGE ---------- */

function saveToStorage(){
  const data = { employees, swaps, shiftTypes };

}

function loadFromStorage(){
  const saved = localStorage.getItem('scioSchedule');
  if (saved) {
    try{
      const data = JSON.parse(saved);
      if (data.employees) employees = data.employees;
      if (data.swaps) swaps = data.swaps;
      if (data.shiftTypes) shiftTypes = data.shiftTypes;
    }catch(e){}
  }
}

/* ---------- ГОРЯЧИЕ КЛАВИШИ ---------- */

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    undo();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
    e.preventDefault();
    redo();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    exportData();
  }
  if (e.key === 'ArrowLeft' && e.ctrlKey) {
    e.preventDefault();
    shiftMonth(-1);
  }
  if (e.key === 'ArrowRight' && e.ctrlKey) {
    e.preventDefault();
    shiftMonth(1);
  }
});

}

loadFromStorage();
initMonthSelect();

const today = new Date();
document.getElementById('monthSel').value = today.getMonth();
document.getElementById('yearInput').value = today.getFullYear();

render();
